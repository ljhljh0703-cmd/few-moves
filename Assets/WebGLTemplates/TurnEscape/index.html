<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme:light; font-family:"Avenir Next","Pretendard",ui-sans-serif,system-ui,sans-serif; --paper:#eee7d8; --surface:#faf5e9; --ink:#293238; --muted:#626963; --line:#c9c0b0; --floor:#e5e0d3; --focus:#5d8960; --blue:#4374b7; --amber:#d09743; --teal:#439491; --stage:#f0ece2; --pad:#293238; --pad-edge:#171e1f; }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; overflow:hidden; background:var(--stage); }
    body { color:var(--ink); }
    button,a { min-width:48px; min-height:48px; border:0; color:inherit; background:transparent; font:inherit; font-weight:750; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    a { display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
    button:focus-visible,a:focus-visible,canvas:focus-visible,textarea:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    button:disabled { opacity:.36; cursor:default; }
    [hidden] { display:none!important; }
    main#app { width:min(100%,920px); height:100dvh; min-height:0; margin:0 auto; padding:max(3px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(3px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); display:grid; grid-template-rows:48px minmax(0,1fr); gap:3px; }
    .utility-bar { width:min(100%,560px); justify-self:center; min-width:0; min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:3px; }
    .top-actions { display:flex; align-items:center; flex:none; gap:6px; }
    .moves { flex:none; padding-left:2px; color:var(--ink); font-size:20px; font-weight:850; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .quick-retry,.icon-button { min-height:48px; border:1px solid var(--line); border-radius:12px; background:var(--surface); box-shadow:0 2px 0 var(--line); }
    .quick-retry:enabled:active,.icon-button:enabled:active { transform:translateY(1px); box-shadow:0 1px 0 var(--line); }
    .quick-retry { flex:none; min-width:78px; padding:0 10px; font-size:15px; font-weight:800; }
    .icon-button { min-width:48px; display:grid; place-items:center; padding:0; font-size:21px; }
    .icon-button svg { width:20px; height:20px; stroke:currentColor; stroke-width:2; fill:none; }
    .play-layout { min-width:0; min-height:0; width:100%; display:grid; grid-template-rows:32px minmax(0,1fr) 234px; gap:4px; }
    .goal-hint { grid-row:1; display:flex; align-items:center; justify-content:center; gap:9px; min-width:0; margin:0; color:var(--ink); font-size:clamp(18px,5.4vw,21px); line-height:1.25; font-weight:800; text-align:center; white-space:nowrap; }
    .goal-mark { width:14px; height:14px; flex:none; border-radius:50%; background:#669bd3; box-shadow:0 0 0 3px color-mix(in srgb,#669bd3 28%,transparent); }
    .goal-piece { color:var(--blue); font-weight:850; }
    .board-stage { grid-row:2; position:relative; min-width:0; min-height:0; width:100%; overflow:hidden; display:grid; place-items:center; }
    .game { min-width:0; min-height:0; width:100%; height:100%; display:grid; place-items:center; }
    canvas { display:block; width:100%; height:auto; max-width:100%; max-height:100%; aspect-ratio:1; border:0; border-radius:0; background:var(--stage); image-rendering:pixelated; }
    .feedback { position:absolute; z-index:2; left:50%; bottom:4px; width:min(calc(100% - 20px),360px); margin:0; padding:7px 9px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); font-size:14px; line-height:1.3; text-align:center; transform:translateX(-50%); }
    .control-slot { grid-row:3; min-height:0; display:grid; place-items:center; }
    .play-controls { width:100%; height:234px; display:grid; grid-template-rows:48px 168px; justify-items:center; gap:18px; }
    .play-controls[hidden] { display:grid!important; visibility:hidden; pointer-events:none; }
    .piece-row { grid-row:1; width:100%; min-height:48px; display:flex; align-items:center; justify-content:center; }
    .piece-row[hidden] { display:flex!important; visibility:hidden; pointer-events:none; }
    .piece-chips { display:flex; align-items:center; justify-content:center; gap:6px; }
    .piece-chip { min-width:48px; min-height:48px; display:grid; place-items:center; padding:0; border:1px solid var(--line); border-radius:9px; background:var(--surface); }
    .piece-chip[aria-pressed="true"] { border-color:var(--focus); box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--focus) 38%,transparent); }
    .piece-mark { width:22px; height:22px; display:block; border:2px solid color-mix(in srgb,var(--blue) 65%,var(--ink)); border-radius:50%; background:var(--blue); }
    .piece-chip[data-piece-index="1"] .piece-mark { border-color:color-mix(in srgb,var(--amber) 65%,var(--ink)); border-radius:2px; background:var(--amber); transform:rotate(45deg); }
    .piece-chip[data-piece-index="2"] .piece-mark { border-color:color-mix(in srgb,var(--teal) 65%,var(--ink)); border-radius:2px; background:var(--teal); }
    .direction-console { grid-row:2; position:relative; width:180px; height:168px; margin:0 auto; }
    .dpad-base { position:absolute; inset:0; z-index:0; pointer-events:none; filter:drop-shadow(0 4px 0 var(--pad-edge)); }
    .dpad-base::before,.dpad-base::after { position:absolute; content:""; border-radius:14px; background:var(--pad); }
    .dpad-base::before { left:62px; top:0; width:56px; height:164px; } .dpad-base::after { left:0; top:56px; width:180px; height:52px; }
    .dpad-center { position:absolute; left:78px; top:70px; z-index:1; width:24px; height:24px; border-radius:50%; background:var(--pad-edge); pointer-events:none; }
    .direction-button { position:absolute; z-index:2; width:56px; height:56px; display:grid; place-items:center; padding:0; border-radius:12px; background:transparent; }
    .direction-button:enabled:hover { background:color-mix(in srgb,#fff 9%,transparent); }
    .direction-button:enabled:active { background:color-mix(in srgb,#000 24%,transparent); }
    .direction-button span { color:var(--paper); font-size:22px; line-height:1; transition:transform 60ms ease-out; }
    .direction-button:enabled:active span { transform:translateY(2px); }
    .direction-up { left:62px; top:0; } .direction-left { left:0; top:56px; } .direction-right { left:124px; top:56px; } .direction-down { left:62px; top:112px; }
    dialog { width:min(360px,calc(100% - 24px)); max-height:calc(100dvh - 24px); margin:auto; padding:0; overflow:auto; border:1px solid var(--line); border-radius:13px; background:var(--surface); color:var(--ink); box-shadow:0 14px 44px color-mix(in srgb,var(--ink) 28%,transparent); }
    dialog::backdrop { background:color-mix(in srgb,var(--ink) 30%,transparent); }
    .dialog-body { display:grid; gap:10px; padding:14px; }
    .dialog-title { margin:0; font-size:21px; font-weight:850; text-align:center; }
    .dialog-room,.dialog-copy { margin:0; color:var(--muted); font-size:14px; line-height:1.4; text-align:center; }
    .dialog-head { display:grid; grid-template-columns:48px minmax(0,1fr) 48px; align-items:center; }
    .dialog-head .dialog-title { grid-column:2; }
    .dialog-close { grid-column:3; min-width:48px; min-height:48px; border:1px solid var(--line); border-radius:9px; background:var(--surface); font-size:14px; }
    .menu-panel { display:grid; gap:10px; }
    .menu-panel[hidden] { display:none; }
    .menu-save-status,.share-panel-feedback { min-height:18px; margin:0; color:var(--muted); font-size:12px; line-height:1.4; text-align:center; }
    .menu-actions { display:grid; gap:7px; }
    .menu-actions button,.menu-actions a,.share-actions button { min-height:48px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); font-size:14px; text-align:center; }
    .menu-actions .primary,.share-actions .primary { border-color:var(--ink); background:var(--ink); color:#fff; }
    .menu-confirm-copy { margin:0; color:var(--ink); font-size:14px; line-height:1.4; text-align:center; }
    .help-list { display:grid; gap:9px; padding:0; margin:0; list-style:none; font-size:14px; line-height:1.4; }
    .help-list li { display:flex; align-items:flex-start; gap:9px; }
    .help-mark { width:20px; height:20px; flex:none; display:grid; place-items:center; border:1px solid var(--line); border-radius:5px; background:var(--floor); color:var(--ink); font-size:14px; }
    .share-record { width:100%; min-height:58px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:#fffdf7; color:var(--ink); font:inherit; font-size:14px; line-height:1.4; resize:vertical; }
    .share-panel-feedback:empty { display:none; }
    .share-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    #result-dialog { width:min(296px,calc(100% - 24px)); }
    .result-card { position:relative; display:grid; gap:10px; padding:13px; }
    .result-title { margin:0; font-size:21px; font-weight:850; text-align:center; }
    .result-turn { margin:0; font-size:38px; font-weight:850; font-variant-numeric:tabular-nums; text-align:center; }
    .result-par { margin:0; color:var(--muted); font-size:14px; text-align:center; }
    .result-share,.result-menu { position:absolute; top:8px; min-width:48px; min-height:48px; display:grid; place-items:center; border-radius:9px; }
    .result-share { right:8px; font-size:20px; } .result-menu { left:8px; font-size:14px; }
    .result-share svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; }
    .result-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .result-actions.is-single { grid-template-columns:1fr; }
    .result-actions button { min-height:48px; padding:0 9px; border:1px solid var(--line); border-radius:9px; background:var(--surface); font-size:14px; }
    .result-actions .result-next { border-color:var(--ink); background:var(--ink); color:#fff; }
    @media (orientation:landscape) and (max-height:520px) { .play-layout { grid-template-columns:minmax(0,1fr) 190px; grid-template-rows:32px minmax(0,1fr); gap:4px; } .goal-hint { grid-column:1; grid-row:1; } .board-stage { grid-column:1; grid-row:2; } .control-slot { grid-column:2; grid-row:1 / span 2; } }
    @media (max-height:520px) and (orientation:portrait) { html,body { overflow-y:auto; } main#app { min-height:520px; height:auto; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main id="app">
    <header class="utility-bar">
      <span id="turn-runline" class="moves">0번 이동</span>
      <div class="top-actions"><button id="restart-top" class="quick-retry" type="button" data-game-action="Restart" disabled>↻ 다시</button><button id="help-toggle" class="icon-button" type="button" aria-label="놀이 방법">?</button><button id="menu-toggle" class="icon-button" type="button" disabled aria-label="게임 메뉴">☰</button></div>
    </header>
    <section class="play-layout" aria-label="Few Moves">
      <p class="goal-hint"><span class="goal-mark" aria-hidden="true"></span><span><strong class="goal-piece">파란 말</strong>을 목표 칸에 넣어요</span></p>
      <section class="board-stage" aria-label="게임 보드">
        <section class="game">
          <canvas id="unity-canvas" tabindex="0" aria-label="Few Moves 보드"></canvas>
        </section>
        <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      </section>
      <section class="control-slot">
        <section id="play-controls" class="play-controls" aria-label="조작">
          <div id="piece-row" class="piece-row" hidden>
            <div class="piece-chips" role="group" aria-label="말 선택">
              <button class="piece-chip" type="button" data-piece-index="0" aria-pressed="true" aria-label="파란 원 말 선택"><span class="piece-mark" aria-hidden="true"></span></button>
              <button class="piece-chip" type="button" data-piece-index="1" aria-pressed="false" aria-label="호박색 마름모 말 선택" hidden><span class="piece-mark" aria-hidden="true"></span></button>
              <button class="piece-chip" type="button" data-piece-index="2" aria-pressed="false" aria-label="청록 네모 말 선택" hidden><span class="piece-mark" aria-hidden="true"></span></button>
            </div>
          </div>
          <div class="direction-console" aria-label="방향 조작">
            <span class="dpad-base" aria-hidden="true"></span><span class="dpad-center" aria-hidden="true"></span>
            <button class="direction-button direction-up" type="button" data-game-action="Up" disabled aria-label="위로 이동"><span aria-hidden="true">▲</span></button>
            <button class="direction-button direction-left" type="button" data-game-action="Left" disabled aria-label="왼쪽으로 이동"><span aria-hidden="true">◀</span></button>
            <button class="direction-button direction-right" type="button" data-game-action="Right" disabled aria-label="오른쪽으로 이동"><span aria-hidden="true">▶</span></button>
            <button class="direction-button direction-down" type="button" data-game-action="Down" disabled aria-label="아래로 이동"><span aria-hidden="true">▼</span></button>
          </div>
        </section>
      </section>
    </section>
  </main>
  <dialog id="result-dialog" aria-labelledby="result-title">
    <section class="result-card">
      <button id="result-menu" class="result-menu" type="button">메뉴</button>
      <button id="result-share" class="result-share" type="button" hidden aria-label="기록 공유">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0 4 4m-4-4L8 7M5 13v6h14v-6"/></svg>
      </button>
      <p id="result-title" class="result-title">클리어</p>
      <p id="result-turn" class="result-turn">0수</p>
      <p id="result-par" class="result-par">최단 0수</p>
      <div id="result-actions" class="result-actions">
        <button id="result-retry" class="result-retry" type="button" data-game-action="Restart" disabled>다시</button>
        <button id="result-next" class="result-next" type="button" data-game-action="Next" disabled>다음</button>
      </div>
    </section>
  </dialog>
  <dialog id="menu-dialog" aria-labelledby="menu-title">
    <div class="dialog-body">
      <section id="menu-main" class="menu-panel">
        <p id="menu-title" class="dialog-title">메뉴</p>
        <p id="menu-room" class="dialog-room">방 —</p>
        <p id="menu-save-status" class="menu-save-status" role="status" aria-live="polite"></p>
        <div class="menu-actions">
          <button id="menu-continue" class="primary" type="button">계속하기</button>
          <button id="menu-save" type="button">저장하기</button>
          <a href="../index.html">다른 모드</a>
          <button id="menu-start-over" type="button">처음부터 하기</button>
        </div>
      </section>
      <section id="menu-confirmation" class="menu-panel" hidden aria-live="polite">
        <p class="dialog-title">처음부터 할까요?</p>
        <p class="menu-confirm-copy">현재 진행을 지우고 첫 번째 판부터 다시 시작해요.</p>
        <div class="menu-actions">
          <button id="menu-start-over-cancel" class="primary" type="button">취소</button>
          <button id="menu-start-over-confirm" type="button">처음부터 하기</button>
        </div>
      </section>
    </div>
  </dialog>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <div class="dialog-body">
      <header class="dialog-head"><span></span><p id="help-title" class="dialog-title">놀이 방법</p><button id="help-close" class="dialog-close" type="button">닫기</button></header>
      <ul class="help-list">
        <li><span class="help-mark" aria-hidden="true">▲</span><span>방향을 누르면 선택한 말이 벽이나 다른 말 앞까지 미끄러져요.</span></li>
        <li><span class="help-mark" aria-hidden="true">●</span><span>파란 말을 목표 칸에 넣으면 성공해요.</span></li>
        <li><span class="help-mark" aria-hidden="true">◆</span><span>말이 여러 개인 방에서는 위의 말 버튼으로 움직일 말을 바꿔요.</span></li>
      </ul>
    </div>
  </dialog>
  <dialog id="share-dialog" aria-labelledby="share-title">
    <div class="dialog-body">
      <p id="share-title" class="dialog-title">기록 공유</p>
      <textarea id="share-text" class="share-record" readonly aria-label="현재 클리어 기록" spellcheck="false"></textarea>
      <p id="share-panel-feedback" class="share-panel-feedback" aria-live="polite"></p>
      <div class="share-actions">
        <button id="share-copy" type="button">복사</button>
        <button id="share-native" class="share-native" type="button" hidden>공유</button>
        <button id="share-close" class="share-close" type="button">닫기</button>
      </div>
    </div>
  </dialog>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var boardStage = document.querySelector(".board-stage");
    var unityInstance = null;
    var gameActionButtons = Array.from(document.querySelectorAll("button[data-game-action]"));
    var pieceButtons = Array.from(document.querySelectorAll("button[data-piece-index]"));
    var pieceRow = document.querySelector("#piece-row");
    var menuButton = document.querySelector("#menu-toggle");
    var helpButton = document.querySelector("#help-toggle");
    var helpDialog = document.querySelector("#help-dialog");
    var helpCloseButton = document.querySelector("#help-close");
    var menuDialog = document.querySelector("#menu-dialog");
    var menuMain = document.querySelector("#menu-main");
    var menuConfirmation = document.querySelector("#menu-confirmation");
    var menuContinueButton = document.querySelector("#menu-continue");
    var menuSaveButton = document.querySelector("#menu-save");
    var menuStartOverButton = document.querySelector("#menu-start-over");
    var menuStartOverConfirmButton = document.querySelector("#menu-start-over-confirm");
    var menuStartOverCancelButton = document.querySelector("#menu-start-over-cancel");
    var menuRoom = document.querySelector("#menu-room");
    var menuSaveStatus = document.querySelector("#menu-save-status");
    var resultDialog = document.querySelector("#result-dialog");
    var resultMenuButton = document.querySelector("#result-menu");
    var resultTitle = document.querySelector("#result-title");
    var resultTurn = document.querySelector("#result-turn");
    var resultPar = document.querySelector("#result-par");
    var resultActions = document.querySelector("#result-actions");
    var resultRetryButton = document.querySelector("#result-retry");
    var resultNextButton = document.querySelector("#result-next");
    var resultShareButton = document.querySelector("#result-share");
    var shareDialog = document.querySelector("#share-dialog");
    var shareText = document.querySelector("#share-text");
    var shareCopyButton = document.querySelector("#share-copy");
    var shareNativeButton = document.querySelector("#share-native");
    var shareCloseButton = document.querySelector("#share-close");
    var sharePanelFeedback = document.querySelector("#share-panel-feedback");
    var feedback = document.querySelector("#feedback");
    var playControls = document.querySelector("#play-controls");
    var turnRunline = document.querySelector("#turn-runline");
    var currentState = null;
    var stateRevision = 0;
    var sharePanelSnapshot = null;
    var nativeOperation = null;
    var nativeOperationId = 0;
    var copyOperation = null;
    var copyOperationId = 0;
    var menuConfirming = false;
    var menuReturnsToResult = false;

    function sizeCanvasToStage() {
      if (!boardStage || !canvas || typeof boardStage.getBoundingClientRect !== "function") return;
      var bounds = boardStage.getBoundingClientRect();
      var side = Math.floor(Math.min(bounds.width, bounds.height, 560));
      if (!Number.isFinite(side) || side < 1) return;
      canvas.style.width = side + "px";
      canvas.style.height = side + "px";
    }
    if (boardStage && typeof ResizeObserver === "function") {
      new ResizeObserver(sizeCanvasToStage).observe(boardStage);
    }
    if (window.addEventListener) window.addEventListener("resize", sizeCanvasToStage);
    sizeCanvasToStage();

    function isNonNegativeInteger(value) {
      return typeof value === "number" && Number.isInteger(value) && value >= 0;
    }
    function isPositiveInteger(value) {
      return typeof value === "number" && Number.isInteger(value) && value > 0;
    }
    function isKnownStatusCode(value) {
      return value === "Playing" || value === "Cleared" || value === "InitializationFailed";
    }
    function isKnownSaveStatus(value) {
      return value === "idle" || value === "changed" || value === "pending" || value === "saved" || value === "failed";
    }
    function isValidObservation(state) {
      if (!state || typeof state !== "object" || Array.isArray(state)) return false;
      if (typeof state.initialized !== "boolean" || typeof state.inputEnabled !== "boolean" ||
          typeof state.restartEnabled !== "boolean" || typeof state.nextEnabled !== "boolean" ||
          typeof state.manualSaveEnabled !== "boolean" || typeof state.startOverEnabled !== "boolean" ||
          typeof state.savePending !== "boolean" || typeof state.saveStatus !== "string" || typeof state.saveError !== "string" ||
          typeof state.room !== "string" || typeof state.status !== "string" ||
          typeof state.statusCode !== "string" || typeof state.message !== "string" ||
          typeof state.error !== "string" || typeof state.fingerprint !== "string" || typeof state.transitioning !== "boolean" ||
          !isNonNegativeInteger(state.roomNumber) || !isNonNegativeInteger(state.roomCount) ||
          !isNonNegativeInteger(state.turn) || !isNonNegativeInteger(state.parMoves) || !isNonNegativeInteger(state.saveRequestId) ||
          !isNonNegativeInteger(state.pieceCount) || !Number.isInteger(state.selectedPieceIndex) ||
          !isKnownStatusCode(state.statusCode) || !isKnownSaveStatus(state.saveStatus)) {
        return false;
      }
      if (!state.initialized) return state.statusCode === "InitializationFailed";
      if (state.savePending && (state.manualSaveEnabled || state.startOverEnabled || state.restartEnabled)) return false;
      if (state.transitioning && state.manualSaveEnabled) return false;
      return state.room.length > 0 && isPositiveInteger(state.roomNumber) &&
        isPositiveInteger(state.roomCount) && state.roomNumber <= state.roomCount &&
        isPositiveInteger(state.pieceCount) && state.pieceCount <= 3 && state.selectedPieceIndex >= 0 && state.selectedPieceIndex < state.pieceCount &&
        state.fingerprint.length > 0 && state.statusCode !== "InitializationFailed";
    }
    function isInitializedState(state) {
      return isValidObservation(state) && state.initialized === true && !state.error;
    }
    function isClearedState(state) {
      return isInitializedState(state) && !state.transitioning && state.statusCode === "Cleared";
    }
    function canShareState(state) {
      return isClearedState(state);
    }
    function isResultState(state) {
      return isValidObservation(state) && state.initialized === true && !state.transitioning &&
        state.statusCode === "Cleared";
    }
    function isActionAllowed(action) {
      var state = currentState;
      if (!unityInstance || !isValidObservation(state) || !state.initialized) return false;
      if (action === "Save") return state.manualSaveEnabled === true;
      if (action === "StartOver") return state.startOverEnabled === true;
      if (action === "Restart") return state.restartEnabled === true && !state.savePending;
      if (state.error) return false;
      if (state.transitioning) return false;
      if (action === "Next") return state.statusCode === "Cleared" && state.nextEnabled === true;
      return state.statusCode === "Playing" && state.inputEnabled === true &&
        (action === "Up" || action === "Down" || action === "Left" || action === "Right");
    }
    function sendGameAction(action) {
      if (!isActionAllowed(action)) return false;
      try {
        unityInstance.SendMessage("GameBootstrap", "HandleInput", action);
        return true;
      } catch (error) {
        setFeedback("입력을 보낼 수 없습니다.");
        return false;
      }
    }
    function isSelectionAllowed(pieceIndex) {
      var state = currentState;
      return !!unityInstance && isInitializedState(state) && !state.savePending && state.inputEnabled === true && !state.transitioning &&
        state.statusCode === "Playing" && state.pieceCount > 1 && Number.isInteger(pieceIndex) &&
        pieceIndex >= 0 && pieceIndex < state.pieceCount;
    }
    function selectPiece(pieceIndex) {
      if (!isSelectionAllowed(pieceIndex)) return false;
      try {
        unityInstance.SendMessage("GameBootstrap", "SelectPiece", String(pieceIndex));
        return true;
      } catch (error) {
        setFeedback("기물을 선택할 수 없습니다.");
        return false;
      }
    }
    function setFeedback(text) {
      feedback.textContent = text || "";
      feedback.hidden = !text;
    }
    function setSharePanelFeedback(text) {
      sharePanelFeedback.textContent = text || "";
    }
    function friendlyError(code) {
      if (code.indexOf("save_") === 0 || code.indexOf("schema_") === 0 || code.indexOf("game_") === 0 || code.indexOf("content_version_") === 0 || code.indexOf("room_hash_") === 0 || code.indexOf("state_invalid") === 0) {
        return "저장 데이터를 확인할 수 없습니다. 다시 시작해 주세요.";
      }
      if (code.indexOf("asset_") === 0) return "필수 게임 이미지를 확인할 수 없습니다.";
      if (code.indexOf("content_") === 0) return "방 데이터를 확인할 수 없습니다.";
      return "게임 상태를 확인할 수 없습니다.";
    }
    function usefulStateFeedback(state) {
      if (!state) return "게임 상태를 확인할 수 없습니다.";
      if (state.error) return friendlyError(state.error);
      if (!state.initialized) return "게임을 시작할 수 없습니다.";
      if (state.transitioning || state.statusCode === "Cleared") return "";
      if (state.message === "벽에 막혔습니다" || state.message === "그쪽으로 갈 수 없습니다" ||
          state.message === "그 방향으로는 미끄러질 수 없습니다" || state.message === "알 수 없는 입력입니다") return state.message;
      return "";
    }
    function formatSaveStatus(state) {
      if (!isValidObservation(state) || !state.initialized) return "저장 정보를 확인할 수 없습니다.";
      if (state.error) return "저장된 진행을 확인할 수 없습니다. 이 방을 다시 시작하거나 처음부터 할 수 있습니다.";
      if (state.savePending) return "이 브라우저에 저장하는 중…";
      if (state.saveStatus === "saved") return "이 브라우저에 저장됨";
      if (state.saveStatus === "failed") return "저장하지 못했습니다. 다시 저장할 수 있습니다.";
      if (state.saveStatus === "changed") return "진행이 바뀌었습니다. 저장하기로 확인하세요.";
      return "저장하기로 이 브라우저 저장을 확인합니다.";
    }
    function setMenuConfirmation(open) {
      menuConfirming = open === true;
      menuMain.hidden = menuConfirming;
      menuConfirmation.hidden = !menuConfirming;
    }
    function renderMenu(state) {
      menuSaveStatus.textContent = formatSaveStatus(state);
      menuSaveButton.disabled = !isActionAllowed("Save");
      menuStartOverButton.disabled = !isActionAllowed("StartOver");
      menuStartOverConfirmButton.disabled = !isActionAllowed("StartOver");
    }
    function openLocalDialog(dialog) {
      if (!dialog || dialog.open) return;
      try {
        if (typeof dialog.showModal === "function") dialog.showModal();
        else {
          dialog.open = true;
          if (typeof dialog.setAttribute === "function") dialog.setAttribute("open", "");
        }
      } catch (error) {
        dialog.open = true;
        if (typeof dialog.setAttribute === "function") dialog.setAttribute("open", "");
      }
    }
    function closeLocalDialog(dialog) {
      if (!dialog || !dialog.open) return;
      if (typeof dialog.close === "function") dialog.close();
      else {
        dialog.open = false;
        if (typeof dialog.removeAttribute === "function") dialog.removeAttribute("open");
      }
    }
    function openMenu(returnsToResult) {
      if (helpDialog.open || shareDialog.open) return;
      menuReturnsToResult = returnsToResult === true;
      setMenuConfirmation(false);
      openLocalDialog(menuDialog);
      renderMenu(currentState);
    }
    function closeMenu() {
      setMenuConfirmation(false);
      closeLocalDialog(menuDialog);
    }
    function openMenuFromResult() {
      if (!isResultState(currentState)) return;
      closeSharePanel();
      closeLocalDialog(resultDialog);
      openMenu(true);
    }
    function isOverlayOpen() {
      return !!((menuDialog && menuDialog.open) || (helpDialog && helpDialog.open) ||
        (resultDialog && resultDialog.open) || (shareDialog && shareDialog.open));
    }
    function formatShareRecord(state) {
      return "Few Moves | 방 " + state.roomNumber + " / " + state.roomCount + " | " + state.turn + "수 클리어";
    }
    function createShareSnapshot(state) {
      return Object.freeze({
        revision: stateRevision,
        room: state.room,
        roomNumber: state.roomNumber,
        roomCount: state.roomCount,
        turn: state.turn,
        fingerprint: state.fingerprint,
        record: formatShareRecord(state)
      });
    }
    function isSnapshotCurrent(snapshot) {
      var state = currentState;
      return !!snapshot && stateRevision === snapshot.revision && canShareState(state) &&
        state.room === snapshot.room && state.roomNumber === snapshot.roomNumber &&
        state.roomCount === snapshot.roomCount && state.turn === snapshot.turn &&
        state.fingerprint === snapshot.fingerprint;
    }
    function isSharePanelCurrent(snapshot) {
      return !!(shareDialog && shareDialog.open) && sharePanelSnapshot === snapshot && isSnapshotCurrent(snapshot);
    }
    function closeSharePanel() {
      sharePanelSnapshot = null;
      setSharePanelFeedback("");
      closeLocalDialog(shareDialog);
    }
    function renderSharePanel() {
      var snapshot = sharePanelSnapshot;
      var isCurrent = isSharePanelCurrent(snapshot);
      var copyBusyForCurrent = !!copyOperation && copyOperation.snapshot === snapshot;
      shareCopyButton.disabled = !isCurrent || copyBusyForCurrent;
      shareNativeButton.hidden = typeof navigator.share !== "function";
      shareNativeButton.disabled = !isCurrent || !!nativeOperation;
    }
    function openSharePanel() {
      if (!canShareState(currentState) || !resultDialog.open) return;
      sharePanelSnapshot = createShareSnapshot(currentState);
      shareText.value = sharePanelSnapshot.record;
      setSharePanelFeedback("");
      openLocalDialog(shareDialog);
      renderSharePanel();
    }
    async function copyShareRecord() {
      var snapshot = sharePanelSnapshot;
      if (!isSharePanelCurrent(snapshot)) return;
      var operation = { id: ++copyOperationId, snapshot: snapshot };
      copyOperation = operation;
      renderSharePanel();
      try {
        if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
          if (isSharePanelCurrent(snapshot) && copyOperation === operation) {
            setSharePanelFeedback("위 기록을 선택해 직접 복사하세요.");
          }
          return;
        }
        await navigator.clipboard.writeText(snapshot.record);
        if (isSharePanelCurrent(snapshot) && copyOperation === operation) {
          setSharePanelFeedback("기록을 클립보드에 복사했습니다.");
        }
      } catch (error) {
        if (isSharePanelCurrent(snapshot) && copyOperation === operation) {
          setSharePanelFeedback("위 기록을 선택해 직접 복사하세요.");
        }
      } finally {
        if (copyOperation === operation) {
          copyOperation = null;
          if (shareDialog.open) renderSharePanel();
        }
      }
    }
    async function requestNativeShare() {
      var snapshot = sharePanelSnapshot;
      if (!isSharePanelCurrent(snapshot) || nativeOperation || typeof navigator.share !== "function") return;
      var operation = { id: ++nativeOperationId, snapshot: snapshot };
      nativeOperation = operation;
      renderSharePanel();
      try {
        await navigator.share({ title: "Few Moves", text: snapshot.record });
        if (nativeOperation === operation && isSharePanelCurrent(snapshot)) {
          setSharePanelFeedback("공유창을 열었습니다.");
        }
      } catch (error) {
        if (error && error.name === "AbortError") return;
        if (nativeOperation === operation && isSharePanelCurrent(snapshot)) {
          setSharePanelFeedback("공유창을 열지 못했습니다. 위 기록을 복사할 수 있습니다.");
        }
      } finally {
        if (nativeOperation === operation) {
          nativeOperation = null;
          if (shareDialog.open) renderSharePanel();
        }
      }
    }
    function renderGameButtons() {
      gameActionButtons.forEach(function (button) {
        button.disabled = !isActionAllowed(button.dataset.gameAction);
      });
    }
    function renderPieceButtons(state) {
      // A selector with a single piece has nothing to choose; its slot stays reserved so the pad does not move.
      pieceRow.hidden = !(!!state && state.initialized === true && state.pieceCount > 1);
      pieceButtons.forEach(function (button) {
        var index = Number(button.dataset.pieceIndex);
        var visible = !!state && state.initialized && index >= 0 && index < state.pieceCount;
        button.hidden = !visible;
        button.disabled = !isSelectionAllowed(index);
        button.setAttribute("aria-pressed", String(visible && state.selectedPieceIndex === index));
      });
    }
    function renderResultDialog(state) {
      if (!isResultState(state)) {
        resultMenuButton.disabled = true;
        closeLocalDialog(resultDialog);
        return;
      }
      if (menuDialog.open) {
        resultMenuButton.disabled = false;
        return;
      }

      var cleared = state.statusCode === "Cleared";
      resultTitle.textContent = "클리어";
      resultTurn.textContent = state.turn + "수";
      resultPar.textContent = "최단 " + state.parMoves + "수";
      resultMenuButton.disabled = false;
      resultNextButton.hidden = !cleared || !state.nextEnabled;
      resultShareButton.hidden = !canShareState(state);
      resultShareButton.disabled = !canShareState(state);
      resultActions.classList.toggle("is-single", resultNextButton.hidden);
      openLocalDialog(resultDialog);
    }
    function renderState(state) {
      var roomLabel = state && state.initialized ? "방 " + state.roomNumber + " / " + state.roomCount : "방 —";
      menuRoom.textContent = roomLabel;
      menuButton.disabled = !state || !state.initialized;
      turnRunline.textContent = state ? state.turn + "번 이동" : "0번 이동";
      playControls.hidden = isResultState(state);
      setFeedback(usefulStateFeedback(state));
      renderGameButtons();
      renderPieceButtons(state);
      renderMenu(state);
      if (!canShareState(state) && shareDialog.open) closeSharePanel();
      if (shareDialog.open) renderSharePanel();
      renderResultDialog(state);
    }
    function invalidateState(message) {
      stateRevision += 1;
      currentState = null;
      window.__nectorial.state = null;
      closeSharePanel();
      menuReturnsToResult = false;
      setMenuConfirmation(false);
      closeLocalDialog(menuDialog);
      closeLocalDialog(resultDialog);
      menuButton.disabled = true;
      menuRoom.textContent = "방 —";
      turnRunline.textContent = "0번 이동";
      playControls.hidden = false;
      resultNextButton.hidden = true;
      resultMenuButton.disabled = true;
      resultShareButton.hidden = true;
      resultShareButton.disabled = true;
      renderGameButtons();
      renderPieceButtons(null);
      setFeedback(message);
    }
    function receiveState(json) {
      var state;
      try { state = JSON.parse(json); } catch (error) { invalidateState("상태 데이터를 확인할 수 없습니다."); return; }
      stateRevision += 1;
      if (!isValidObservation(state)) {
        currentState = null;
        window.__nectorial.state = null;
        closeSharePanel();
        renderState(null);
        setFeedback("상태 데이터를 확인할 수 없습니다.");
        return;
      }
      currentState = Object.freeze(state);
      window.__nectorial.state = currentState;
      renderState(currentState);
      window.dispatchEvent(new CustomEvent("nectorial-state", { detail: currentState }));
    }
    function actionForKeyboardEvent(event) {
      if (event.code === "ArrowUp") return "Up";
      if (event.code === "ArrowDown") return "Down";
      if (event.code === "ArrowLeft") return "Left";
      if (event.code === "ArrowRight") return "Right";
      if (event.code === "KeyR" || String(event.key || "").toLowerCase() === "r") return "Restart";
      return null;
    }
    function selectionForKeyboardEvent(event) {
      if (event.code === "Digit1" || event.code === "Numpad1" || event.key === "1") return 0;
      if (event.code === "Digit2" || event.code === "Numpad2" || event.key === "2") return 1;
      if (event.code === "Digit3" || event.code === "Numpad3" || event.key === "3") return 2;
      return -1;
    }
    function isEditableOrDialogTarget(target) {
      if (!target || typeof target.closest !== "function") return false;
      return !!target.closest("input, textarea, select, option, [contenteditable], dialog");
    }
    function isNativeButtonActivation(event) {
      if (!event.target || typeof event.target.closest !== "function") return false;
      if (!event.target.closest("button")) return false;
      return event.code === "Space" || event.code === "Enter" || event.key === " " || event.key === "Spacebar" || event.key === "Enter";
    }
    document.addEventListener("keydown", function (event) {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (isOverlayOpen() || isEditableOrDialogTarget(event.target)) return;
      if (isNativeButtonActivation(event)) {
        if (event.repeat) event.preventDefault();
        return;
      }
      var selection = selectionForKeyboardEvent(event);
      if (selection >= 0) {
        if (!isSelectionAllowed(selection)) return;
        event.preventDefault();
        if (event.repeat) return;
        selectPiece(selection);
        return;
      }
      var action = actionForKeyboardEvent(event);
      if (!action || !isActionAllowed(action)) return;
      event.preventDefault();
      if (event.repeat) return;
      sendGameAction(action);
    });
    window.__nectorial = { state: null, receiveState: receiveState };
    gameActionButtons.forEach(function (button) {
      button.addEventListener("click", function (event) {
        if (event && (event.ctrlKey || event.metaKey || event.altKey)) return;
        if (menuDialog.open || helpDialog.open || shareDialog.open) return;
        if (resultDialog.open && button !== resultRetryButton && button !== resultNextButton) return;
        if (!resultDialog.open && (button === resultRetryButton || button === resultNextButton)) return;
        sendGameAction(button.dataset.gameAction);
      });
    });
    pieceButtons.forEach(function (button) {
      button.addEventListener("click", function (event) {
        if (event && (event.ctrlKey || event.metaKey || event.altKey)) return;
        if (isOverlayOpen()) return;
        selectPiece(Number(button.dataset.pieceIndex));
      });
    });
    menuButton.addEventListener("click", function () {
      if (!currentState || !currentState.initialized || isOverlayOpen()) return;
      openMenu(false);
    });
    helpButton.addEventListener("click", function () {
      if (isOverlayOpen()) return;
      openLocalDialog(helpDialog);
    });
    helpCloseButton.addEventListener("click", function () { closeLocalDialog(helpDialog); });
    menuSaveButton.addEventListener("click", function () { sendGameAction("Save"); });
    menuStartOverButton.addEventListener("click", function () {
      if (!isActionAllowed("StartOver")) return;
      setMenuConfirmation(true);
    });
    menuStartOverConfirmButton.addEventListener("click", function () {
      if (!menuConfirming || !isActionAllowed("StartOver")) return;
      setMenuConfirmation(false);
      sendGameAction("StartOver");
    });
    menuStartOverCancelButton.addEventListener("click", function () { setMenuConfirmation(false); });
    menuContinueButton.addEventListener("click", closeMenu);
    resultMenuButton.addEventListener("click", openMenuFromResult);
    resultShareButton.addEventListener("click", openSharePanel);
    shareCopyButton.addEventListener("click", function () { copyShareRecord(); });
    shareNativeButton.addEventListener("click", function () { requestNativeShare(); });
    shareCloseButton.addEventListener("click", closeSharePanel);
    resultDialog.addEventListener("cancel", function (event) { event.preventDefault(); });
    helpDialog.addEventListener("cancel", function (event) { event.preventDefault(); closeLocalDialog(helpDialog); });
    menuDialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      if (menuConfirming) {
        setMenuConfirmation(false);
        return;
      }
      closeMenu();
    });
    menuDialog.addEventListener("close", function () {
      var shouldRestoreResult = menuReturnsToResult;
      menuReturnsToResult = false;
      setMenuConfirmation(false);
      if (shouldRestoreResult && isResultState(currentState)) openLocalDialog(resultDialog);
    });
    shareDialog.addEventListener("close", function () {
      sharePanelSnapshot = null;
      setSharePanelFeedback("");
    });
    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      autoSyncPersistentDataPath: true,
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config).then(function (instance) {
        unityInstance = instance;
        reportReducedMotionPreference();
        if (currentState) renderState(currentState);
      }).catch(showLoadError);
    };
    script.onerror = function () { showLoadError("로더 파일을 불러오지 못했습니다."); };
    document.body.appendChild(script);
    function showLoadError(error) {
      console.error(error);
      unityInstance = null;
      invalidateState("게임을 시작할 수 없습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요.");
    }
    function reportReducedMotionPreference() {
      if (!unityInstance) return;
      var reduced = false;
      try { reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (error) {}
      unityInstance.SendMessage("GameBootstrap", "SetReducedMotion", reduced ? "true" : "false");
    }
  </script>
</body>
</html>
