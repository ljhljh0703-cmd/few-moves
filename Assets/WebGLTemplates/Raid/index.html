<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Few Moves 레이드</title>
  <style>
    :root { color-scheme: light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --surface:#f0ece2; --ink:#293238; --muted:#6e736f; --floor:#e5e0d3; --grid:#d2cbbb; --charcoal:#313a3b; --edge:#171e1f; --pressed:#151c1d; --focus:#5d8960; --player:#4374b7; --tail:#d09743; --snake:#495357; --shield:#5d8960; --magnet:#9b6a9a; --slow:#527d8d; }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; overflow-x:hidden; overflow-y:auto; background:var(--surface); }
    body { min-height:100svh; color:var(--ink); }
    button { min-width:48px; min-height:48px; border:0; background:transparent; color:inherit; font:inherit; font-weight:700; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    button:focus-visible, canvas:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    button:disabled { opacity:.36; cursor:default; }
    main#app { width:min(640px,100%); min-height:100svh; height:100svh; margin:0 auto; padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); display:grid; grid-template-rows:64px minmax(0,1fr); gap:8px; }
    .topbar { position:relative; min-height:64px; display:grid; grid-template-columns:48px 1fr 48px; align-items:center; gap:8px; }
    .topbar h1 { margin:0; font-size:17px; line-height:1.2; text-align:center; }
    .topbar small { display:block; margin-top:3px; color:var(--muted); font-size:11px; font-weight:600; }
    .icon-button { display:grid; place-items:center; border-radius:12px; }
    .raid-layout { min-height:0; display:grid; grid-template-rows:minmax(150px,1fr) auto; gap:8px; justify-items:center; }
    .board-stage { position:relative; width:100%; min-height:0; display:grid; place-items:center; }
    #unity-canvas { display:block; width:min(100%,560px); height:auto; max-width:100%; max-height:100%; aspect-ratio:1/1; border:1px solid var(--grid); border-radius:6px; background:var(--floor); box-shadow:0 5px 0 color-mix(in srgb,var(--charcoal) 16%,transparent); image-rendering:pixelated; }
    .controls { width:min(100%,360px); min-height:0; display:grid; align-content:start; gap:4px; }
    .status-row { min-height:48px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:5px; }
    .status-chip { display:inline-flex; align-items:center; justify-content:center; gap:5px; color:var(--muted); font-size:11px; font-weight:700; white-space:nowrap; }
    .status-chip strong { color:var(--ink); font-size:14px; }
    .status-dot { width:12px; height:12px; border-radius:2px; background:var(--player); }
    .status-dot.snake { background:var(--snake); transform:rotate(45deg); }
    .turn-label { display:grid; place-items:center; min-width:104px; min-height:40px; padding:4px 8px; border:1px solid var(--grid); border-radius:9px; background:#fffdf7; font-size:13px; line-height:1.15; text-align:center; }
    .turn-label small { color:var(--muted); font-size:10px; }
    .item-row { display:flex; justify-content:center; gap:6px; min-height:32px; }
    .item-badge { display:inline-flex; align-items:center; gap:4px; min-height:30px; padding:3px 7px; border:1px solid var(--grid); border-radius:999px; background:#fffdf7; color:var(--muted); font-size:10px; font-weight:800; }
    .item-badge strong { color:var(--ink); font-size:11px; }
    .item-badge.shield strong { color:var(--shield); }
    .item-badge.magnet strong { color:var(--magnet); }
    .item-badge.slow strong { color:var(--slow); }
    .dpad { position:relative; width:180px; height:168px; margin:0 auto; }
    .dpad button { position:absolute; display:grid; place-items:center; width:56px; height:56px; padding:0; border-radius:12px; color:var(--ink); background:transparent; }
    .dpad button::after { position:absolute; inset:0; z-index:0; content:""; border-radius:12px; background:var(--edge); }
    .dpad button::before { position:absolute; inset:3px; z-index:1; content:""; border-radius:10px; background:linear-gradient(135deg,var(--charcoal),color-mix(in srgb,var(--charcoal) 78%,var(--edge))); }
    .dpad button:enabled:active::before { background:var(--pressed); }
    .dpad button span { position:relative; z-index:2; color:var(--surface); font-size:24px; }
    .dpad-up { left:62px; top:0; } .dpad-left { left:0; top:56px; } .dpad-right { left:124px; top:56px; } .dpad-down { left:62px; top:112px; }
    .action-row { display:flex; justify-content:center; gap:7px; min-height:48px; }
    .text-button { min-height:48px; padding:0 14px; border:1px solid var(--grid); border-radius:10px; background:#fffdf7; font-size:12px; }
    .feedback { min-height:22px; margin:0; color:var(--muted); font-size:11px; text-align:center; }
    dialog { width:min(286px,calc(100% - 36px)); border:1px solid var(--charcoal); border-radius:13px; color:var(--ink); background:var(--surface); box-shadow:0 16px 50px color-mix(in srgb,var(--charcoal) 28%,transparent); }
    dialog::backdrop { background:color-mix(in srgb,var(--charcoal) 38%,transparent); }
    .dialog-card { display:grid; gap:12px; padding:18px; text-align:center; }
    .dialog-title { margin:0; font-size:24px; font-weight:800; }
    .dialog-copy { margin:0; color:var(--muted); font-size:12px; line-height:1.5; }
    .dialog-actions { display:flex; justify-content:center; gap:7px; }
    .dialog-actions button { min-height:48px; padding:0 14px; border:1px solid var(--grid); border-radius:9px; }
    .dialog-actions .primary { color:#fff; background:var(--charcoal); border-color:var(--charcoal); }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <button id="restart-top" class="icon-button" type="button" disabled aria-label="레이드 다시 시작"><span aria-hidden="true">↻</span></button>
      <h1>Few Moves<small>레이드</small></h1>
      <span aria-hidden="true"></span>
    </header>
    <section class="raid-layout" aria-label="Few Moves 레이드">
      <section class="board-stage" aria-label="레이드 보드"><canvas id="unity-canvas" tabindex="0" aria-label="플레이어와 뱀이 있는 레이드 보드"></canvas></section>
      <section class="controls" aria-label="레이드 조작">
        <div class="status-row">
          <span class="status-chip"><span class="status-dot" aria-hidden="true"></span><strong id="player-status">플레이어</strong><span id="player-state">준비</span></span>
          <span id="turn-label" class="turn-label">레이드 대기<small>행동 0</small></span>
          <span class="status-chip"><span class="status-dot snake" aria-hidden="true"></span><strong>뱀</strong><span id="snake-state">순찰</span></span>
        </div>
        <div class="item-row" aria-label="레이드 강화 상태">
          <span class="item-badge"><strong>◆</strong> 꼬리 <span id="tail-count">0 / 3</span></span>
          <span class="item-badge shield"><strong>▣</strong> 보호막 <span id="shield-count">0</span></span>
          <span class="item-badge magnet"><strong>✦</strong> 자석 <span id="magnet-count">0</span></span>
          <span class="item-badge slow"><strong>◌</strong> 감속 <span id="slow-count">0</span></span>
        </div>
        <div class="dpad" aria-label="방향 조작">
          <button class="dpad-up" type="button" data-raid-action="Slide" data-direction="Up" disabled aria-label="위로 이동"><span aria-hidden="true">▲</span></button>
          <button class="dpad-left" type="button" data-raid-action="Slide" data-direction="Left" disabled aria-label="왼쪽으로 이동"><span aria-hidden="true">◀</span></button>
          <button class="dpad-right" type="button" data-raid-action="Slide" data-direction="Right" disabled aria-label="오른쪽으로 이동"><span aria-hidden="true">▶</span></button>
          <button class="dpad-down" type="button" data-raid-action="Slide" data-direction="Down" disabled aria-label="아래로 이동"><span aria-hidden="true">▼</span></button>
        </div>
        <div class="action-row"><button id="restart-button" class="text-button" type="button" data-raid-action="Restart" disabled>다시 시작</button></div>
        <p id="feedback" class="feedback" role="status" aria-live="polite">레이드를 준비하는 중입니다.</p>
      </section>
    </section>
  </main>
  <dialog id="result-dialog" aria-labelledby="result-title"><div class="dialog-card"><p id="result-title" class="dialog-title">레이드 결과</p><p id="result-copy" class="dialog-copy"></p><div class="dialog-actions"><button id="result-restart" class="primary" type="button" data-raid-action="Restart">다시 시작</button></div></div></dialog>
  <script>
    (function () {
      "use strict";
      var canvas = document.querySelector("#unity-canvas");
      var boardStage = document.querySelector(".board-stage");
      var unityInstance = null;
      var currentState = null;
      var feedback = document.querySelector("#feedback");
      var turnLabel = document.querySelector("#turn-label");
      var playerState = document.querySelector("#player-state");
      var snakeState = document.querySelector("#snake-state");
      var tailCount = document.querySelector("#tail-count");
      var shieldCount = document.querySelector("#shield-count");
      var magnetCount = document.querySelector("#magnet-count");
      var slowCount = document.querySelector("#slow-count");
      var resultDialog = document.querySelector("#result-dialog");
      var resultTitle = document.querySelector("#result-title");
      var resultCopy = document.querySelector("#result-copy");

      function openDialog(dialog) { if (!dialog || dialog.open) return; try { if (dialog.showModal) dialog.showModal(); else dialog.setAttribute("open", ""); } catch (error) { dialog.setAttribute("open", ""); } }
      function closeDialog(dialog) { if (!dialog || !dialog.open) return; if (dialog.close) dialog.close(); else dialog.removeAttribute("open"); }
      function validState(state) { return state && typeof state.initialized === "boolean" && typeof state.inputEnabled === "boolean" && typeof state.transitioning === "boolean" && typeof state.statusCode === "string"; }
      function actionAllowed(button) {
        if (!currentState || !validState(currentState) || !currentState.initialized || currentState.transitioning) return false;
        var action = button.dataset.raidAction;
        if (action === "Slide") return currentState.inputEnabled && (currentState.statusCode === "Playing" || currentState.statusCode === "Armed");
        return action === "Restart" && (currentState.statusCode === "Failed" || currentState.statusCode === "Cleared");
      }
      function renderButtons() { Array.from(document.querySelectorAll("button[data-raid-action]")).forEach(function (button) { button.disabled = !actionAllowed(button); }); document.querySelector("#restart-top").disabled = !currentState || !actionAllowed({ dataset:{ raidAction:"Restart" } }); }
      function renderState(observation) {
        if (!validState(observation)) return;
        currentState = observation;
        window.__nectorialRaid.state = currentState;
        var state = observation;
        var status = state.statusCode || "Playing";
        turnLabel.innerHTML = (status === "Armed" ? "강화 완료" : status === "Cleared" ? "격파 성공" : status === "Failed" ? "실패" : "레이드 진행") + "<small>행동 " + (state.actions || 0) + "</small>";
        playerState.textContent = status === "Failed" ? "회복 필요" : status === "Cleared" ? "완주" : status === "Armed" ? "박치기 준비" : "이동";
        snakeState.textContent = status === "Cleared" ? "멈춤" : status === "Failed" ? "충돌" : "순찰";
        tailCount.textContent = (state.tailCount || 0) + " / " + (state.tailTarget || 3);
        shieldCount.textContent = state.shieldCharges || 0;
        magnetCount.textContent = state.magnetStepsRemaining || 0;
        slowCount.textContent = state.slowStepsRemaining || 0;
        feedback.textContent = observation.message || observation.error || "";
        renderButtons();
        if (status === "Cleared" || status === "Failed") {
          resultTitle.textContent = status === "Cleared" ? "뱀을 피하고 격파" : "다시 도전";
          resultCopy.textContent = status === "Cleared" ? "꼬리 조각을 모두 모은 뒤 몸통을 맞혔습니다." : "보호막이 없던 충돌로 이번 판이 끝났습니다.";
          openDialog(resultDialog);
        } else closeDialog(resultDialog);
      }
      function receiveState(json) { try { renderState(JSON.parse(json)); } catch (error) { feedback.textContent = "레이드 상태를 확인할 수 없습니다."; } }
      function send(command) { if (!unityInstance || !currentState) return false; unityInstance.SendMessage("RaidBootstrap", "HandleRaidCommand", JSON.stringify(command)); return true; }
      function action(button) { if (!actionAllowed(button)) return; var kind = button.dataset.raidAction; if (kind === "Restart") closeDialog(resultDialog); send(kind === "Slide" ? { kind:"Slide", direction:button.dataset.direction } : { kind:"Restart" }); }
      Array.from(document.querySelectorAll("button[data-raid-action]")).forEach(function (button) { button.addEventListener("click", function () { action(button); }); });
      document.querySelector("#restart-top").addEventListener("click", function () { if (currentState && actionAllowed({ dataset:{ raidAction:"Restart" } })) { closeDialog(resultDialog); send({ kind:"Restart" }); } });
      document.addEventListener("keydown", function (event) { if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return; var direction = { ArrowUp:"Up", ArrowDown:"Down", ArrowLeft:"Left", ArrowRight:"Right" }[event.key]; if (!direction || !currentState || !actionAllowed({ dataset:{ raidAction:"Slide" } })) return; event.preventDefault(); send({ kind:"Slide", direction:direction }); });
      window.__nectorialRaid = { state:null, receiveState:receiveState };
      function resizeCanvasToStage() { if (!boardStage || !canvas) return; var rect = boardStage.getBoundingClientRect(); var side = Math.floor(Math.min(rect.width, rect.height)); if (side <= 0) return; canvas.style.width = side + "px"; canvas.style.height = side + "px"; }
      if (typeof ResizeObserver === "function") new ResizeObserver(resizeCanvasToStage).observe(boardStage);
      window.addEventListener("resize", resizeCanvasToStage); resizeCanvasToStage();
      var loader = document.createElement("script"); loader.src = "Build/{{{ LOADER_FILENAME }}}";
      loader.onload = function () { createUnityInstance(canvas, { dataUrl:"Build/{{{ DATA_FILENAME }}}", frameworkUrl:"Build/{{{ FRAMEWORK_FILENAME }}}", codeUrl:"Build/{{{ CODE_FILENAME }}}", streamingAssetsUrl:"StreamingAssets", companyName:"Independent", productName:"Few Moves Raid", productVersion:"0.1.0-raid", matchWebGLToCanvasSize:true, devicePixelRatio:1 }, function (progress) { feedback.textContent = "레이드를 불러오는 중 " + Math.round(progress * 100) + "%"; }).then(function (instance) { unityInstance = instance; resizeCanvasToStage(); }).catch(function () { feedback.textContent = "레이드를 시작할 수 없습니다."; }); };
      loader.onerror = function () { feedback.textContent = "레이드 빌드 파일을 불러올 수 없습니다."; };
      document.body.appendChild(loader);
    }());
  </script>
</body>
</html>
