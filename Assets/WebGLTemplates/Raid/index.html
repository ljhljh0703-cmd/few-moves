<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Few Moves · 뱀 레이드</title>
  <style>
    :root { color-scheme:light; font-family:"Avenir Next","Pretendard",ui-sans-serif,system-ui,sans-serif; --paper:#eee7d8; --surface:#faf5e9; --ink:#293238; --muted:#626963; --line:#c9c0b0; --floor:#e5e0d3; --gold:#d5a043; --blue:#4374b7; --console:#d1c5af; --focus:#5d8960; --stage:#f0ece2; --pad:#293238; --pad-edge:#171e1f; }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; overflow:hidden; background:var(--stage); }
    body { color:var(--ink); }
    button,a { min-width:48px; min-height:48px; border:0; color:inherit; background:transparent; font:inherit; font-weight:750; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    a { display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
    button:focus-visible,a:focus-visible,input:focus-visible,canvas:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    button:disabled { opacity:.36; cursor:default; }
    [hidden] { display:none!important; }
    main#app { width:min(100%,920px); height:100dvh; min-height:0; margin:0 auto; padding:max(3px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(3px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); display:grid; grid-template-rows:48px minmax(0,1fr); gap:3px; }
    .topbar { width:min(100%,560px); justify-self:center; min-width:0; min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:3px; }
    .top-actions { display:flex; align-items:center; flex:none; gap:6px; }
    .moves { flex:none; padding-left:2px; color:var(--ink); font-size:20px; font-weight:850; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .icon-button { min-height:48px; border:1px solid var(--line); border-radius:12px; background:var(--surface); box-shadow:0 2px 0 var(--line); }
    .icon-button:enabled:active { transform:translateY(1px); box-shadow:0 1px 0 var(--line); }
    .icon-button { min-width:48px; display:grid; place-items:center; padding:0; font-size:21px; }
    .raid-layout { min-width:0; min-height:0; display:grid; grid-template-rows:50px minmax(0,1fr) 208px; gap:4px; }
    .goal-panel { grid-row:1; width:min(100%,560px); justify-self:center; min-width:0; height:50px; display:grid; grid-template-rows:minmax(0,1fr) auto; align-items:center; justify-items:center; }
    .picto-hud { height:34px; display:flex; align-items:center; gap:8px; padding:0 8px; border:2px solid transparent; border-radius:12px; }
    .picto-hud svg { display:block; width:28px; height:28px; }
    .charge-meter { display:flex; align-items:center; gap:2px; }
    .charge-pip:not(.filled) .slot-f,.charge-pip:not(.filled) .slot-h { display:none; }
    .picto-player .picto-powered { display:none; }
    .goal-panel.is-powered .picto-player .picto-plain { display:none; }
    .goal-panel.is-powered .picto-player .picto-powered { display:inline; }
    .picto-arrow .arrow-line { stroke-dasharray:0.12 0.09; }
    .picto-arrow,.picto-head { opacity:.38; }
    .goal-panel.is-armed .picto-hud { border-color:var(--ink); background:color-mix(in srgb,var(--gold) 18%,var(--surface)); }
    .goal-panel.is-armed .picto-arrow .arrow-line { stroke-dasharray:none; }
    .goal-panel.is-armed .picto-arrow,.goal-panel.is-armed .picto-head { opacity:1; }
    .sr-only,.feedback:not(.is-alert) { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
    .feedback { max-width:100%; margin:0; overflow:hidden; color:var(--ink); font-size:13px; font-weight:750; line-height:16px; white-space:nowrap; text-overflow:ellipsis; }
    .board-stage { grid-row:2; position:relative; width:100%; min-height:0; overflow:hidden; display:grid; place-items:center; }
    #unity-canvas { display:block; width:100%; height:auto; max-width:100%; max-height:100%; aspect-ratio:1; border:0; border-radius:0; background:var(--stage); image-rendering:pixelated; }
    .controls { grid-row:3; width:100%; min-height:0; display:grid; grid-template-rows:24px 168px; justify-items:center; align-content:end; gap:16px; }
    .effect-row { grid-row:1; min-height:24px; display:flex; justify-content:center; align-items:center; gap:6px; }
    .effect-row[hidden] { display:flex!important; visibility:hidden; }
    .dpad { grid-row:2; position:relative; width:180px; height:168px; margin:0 auto; }
    .dpad-base { position:absolute; inset:0; z-index:0; pointer-events:none; filter:drop-shadow(0 4px 0 var(--pad-edge)); }
    .dpad-base::before,.dpad-base::after { position:absolute; content:""; border-radius:14px; background:var(--pad); }
    .dpad-base::before { left:62px; top:0; width:56px; height:164px; } .dpad-base::after { left:0; top:56px; width:180px; height:52px; }
    .dpad-center { position:absolute; left:78px; top:70px; z-index:1; width:24px; height:24px; border-radius:50%; background:var(--pad-edge); pointer-events:none; }
    .dpad button { position:absolute; z-index:2; width:56px; height:56px; display:grid; place-items:center; padding:0; border-radius:12px; background:transparent; }
    .dpad button:enabled:hover { background:color-mix(in srgb,#fff 9%,transparent); }
    .dpad button:enabled:active { background:color-mix(in srgb,#000 24%,transparent); }
    .dpad button span { color:var(--paper); font-size:22px; line-height:1; }
    .dpad button:enabled:active span { transform:translateY(2px); }
    .dpad-up { left:62px; top:0; } .dpad-left { left:0; top:56px; } .dpad-right { left:124px; top:56px; } .dpad-down { left:62px; top:112px; }
    dialog { width:min(360px,calc(100% - 24px)); max-height:calc(100dvh - 24px); padding:0; border:1px solid var(--line); border-radius:13px; color:var(--ink); background:var(--surface); box-shadow:0 14px 44px color-mix(in srgb,var(--ink) 28%,transparent); overflow:auto; }
    dialog::backdrop { background:color-mix(in srgb,var(--ink) 26%,transparent); }
    #result-dialog { width:min(296px,calc(100% - 24px)); margin:auto; }
    #result-dialog::backdrop { background:transparent; }
    .dialog-card { display:grid; gap:10px; padding:13px; }
    .dialog-title { margin:0; font-size:21px; font-weight:850; text-align:center; }
    .dialog-copy,.record-note { margin:0; color:var(--muted); font-size:13px; line-height:1.45; text-align:center; }
    .dialog-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }
    .dialog-actions button,.dialog-actions a { flex:1 1 82px; min-height:48px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface); font-size:14px; text-align:center; }
    .dialog-actions .primary { color:#fff; background:var(--ink); border-color:var(--ink); }
    .result-head { display:grid; grid-template-columns:48px minmax(0,1fr) 48px; align-items:center; }
    .result-head .dialog-title { grid-column:2; }
    .result-head button { grid-column:3; min-width:48px; min-height:48px; border-radius:8px; font-size:20px; }
    .result-turn { margin:0; color:var(--ink); font-size:44px; font-weight:850; line-height:1.1; font-variant-numeric:tabular-nums; text-align:center; }
    .record-head { display:grid; grid-template-columns:48px 1fr 48px; align-items:center; }
    .record-head h2 { margin:0; font-size:18px; text-align:center; }
    .record-close { border:1px solid var(--line); border-radius:9px; background:var(--surface); font-size:14px; }
    .storage-retry { position:absolute; z-index:2; min-height:48px; padding:0 18px; border:1px solid var(--line); border-radius:9px; background:var(--surface); font-size:15px; font-weight:750; }
    .storage-retry[hidden] { display:none; }
    .help-list { display:grid; gap:7px; padding:0; margin:0; list-style:none; font-size:14px; line-height:1.3; }
    .help-list li { display:flex; align-items:center; gap:9px; }
    .legend-mark { width:20px; height:20px; flex:none; image-rendering:pixelated; }
    .record-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .record-card { min-height:86px; padding:10px; border:1px solid var(--line); border-radius:11px; background:var(--surface); }
    .record-card h3 { margin:0 0 6px; font-size:14px; }
    .record-value { margin:0; color:var(--ink); font-size:18px; font-weight:850; }
    .record-meta { min-height:16px; margin:3px 0 0; color:var(--muted); font-size:12px; }
    .record-compare { min-height:32px; display:grid; place-items:center; margin:0; padding:6px 8px; border-radius:9px; background:var(--floor); color:var(--ink); font-size:12px; font-weight:750; text-align:center; }
    .record-fallback { width:100%; min-height:48px; padding:0 9px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); font:inherit; font-size:12px; }
    @media (orientation:landscape) and (max-height:520px) { .raid-layout { grid-template-columns:minmax(0,1fr) 190px; grid-template-rows:50px minmax(0,1fr); column-gap:7px; } .goal-panel { grid-column:1; grid-row:1; } .board-stage { grid-column:1; grid-row:2; } .controls { grid-column:2; grid-row:1 / span 2; align-content:center; } }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important; } }
  </style>
</head>
