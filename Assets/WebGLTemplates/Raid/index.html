<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Few Moves 레이드</title>
  <style>
    :root { color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --surface:#f0ece2; --ink:#293238; --muted:#6e736f; --floor:#e5e0d3; --grid:#d2cbbb; --charcoal:#313a3b; --edge:#171e1f; --pressed:#151c1d; --focus:#5d8960; --player:#4374b7; --tail:#d09743; --snake:#495357; --shield:#5d8960; --magnet:#9b6a9a; --slow:#527d8d; }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; overflow:hidden; background:var(--surface); }
    body { min-height:100svh; color:var(--ink); }
    button,a { min-width:48px; min-height:48px; border:0; color:inherit; background:transparent; font:inherit; font-weight:750; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    a { display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
    button:focus-visible,a:focus-visible,input:focus-visible,canvas:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    button:disabled { opacity:.36; cursor:default; }
    main#app { width:min(640px,100%); height:100svh; margin:0 auto; padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); display:grid; grid-template-rows:48px minmax(0,1fr); gap:6px; }
    .topbar { min-height:48px; display:grid; grid-template-columns:48px minmax(64px,1fr) auto; align-items:center; gap:4px; }
    .topbar h1 { margin:0; font-size:16px; line-height:1.1; text-align:center; }
    .topbar small { display:block; margin-top:2px; color:var(--muted); font-size:10px; font-weight:650; }
    .icon-button,.top-action { display:grid; place-items:center; min-width:48px; min-height:48px; padding:0 7px; border-radius:10px; font-size:11px; }
    .top-actions { display:flex; gap:2px; }
    .top-action { border:1px solid var(--grid); background:#fffdf7; }
    .raid-layout { min-height:0; display:grid; grid-template-rows:minmax(150px,1fr) auto; gap:6px; justify-items:center; }
    .board-stage { position:relative; width:100%; min-height:0; display:grid; place-items:center; }
    #unity-canvas { display:block; width:min(100%,560px); height:auto; max-width:100%; max-height:100%; aspect-ratio:1; border:2px solid color-mix(in srgb,var(--charcoal) 32%,var(--grid)); border-radius:7px; background:var(--floor); box-shadow:0 6px 0 color-mix(in srgb,var(--charcoal) 16%,transparent),0 0 0 1px color-mix(in srgb,var(--grid) 78%,transparent); image-rendering:pixelated; }
    .controls { width:min(100%,360px); display:grid; align-content:start; gap:3px; }
    .status-row { width:100%; min-height:48px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:stretch; gap:6px; }
    .goal-panel { min-width:0; min-height:48px; display:grid; grid-template-columns:20px minmax(0,1fr) auto; align-items:center; gap:5px; padding:4px 7px; border:1px solid var(--grid); border-radius:9px; background:#fffdf7; }
    .goal-icon,.bonus-icon { display:block; width:18px; height:18px; flex:0 0 auto; }
    .goal-icon.tail,.bonus-icon.tail { color:var(--tail); }
    .bonus-icon.shield { color:var(--shield); }
    .bonus-icon.magnet { color:var(--magnet); }
    .bonus-icon.slow { color:var(--slow); }
    .goal-copy { min-width:0; display:grid; gap:1px; }
    .goal-copy strong { min-width:0; color:var(--ink); font-size:11px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .goal-copy small { min-width:0; color:var(--muted); font-size:9px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .charge-meter { display:flex; align-items:center; gap:3px; }
    .charge-pip { width:8px; height:16px; border:1px solid var(--grid); border-radius:2px; background:transparent; opacity:.76; }
    .charge-pip.filled { border-color:var(--tail); background:var(--tail); opacity:1; }
    .charge-pip.armed { box-shadow:0 0 0 1px color-mix(in srgb,var(--tail) 70%,transparent); }
    .turn-label { display:grid; place-items:center; min-width:78px; min-height:48px; padding:3px 7px; border:1px solid var(--grid); border-radius:9px; background:#fffdf7; font-size:11px; line-height:1.1; text-align:center; }
    .turn-label small { color:var(--muted); font-size:9px; }
    .bonus-row { width:100%; min-height:44px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
    .bonus-chip { min-width:0; min-height:44px; display:grid; grid-template-columns:18px minmax(0,1fr); align-items:center; column-gap:4px; padding:4px 5px; border:1px solid var(--grid); border-radius:9px; background:#fffdf7; }
    .bonus-copy { min-width:0; display:grid; gap:1px; }
    .bonus-copy strong { min-width:0; color:var(--ink); font-size:9px; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bonus-copy strong span { color:var(--muted); font-size:8px; }
    .bonus-chip.shield .bonus-copy strong span { color:var(--shield); }
    .bonus-chip.magnet .bonus-copy strong span.active { color:var(--magnet); }
    .bonus-chip.slow .bonus-copy strong span.active { color:var(--slow); }
    .bonus-copy small { min-width:0; color:var(--muted); font-size:8px; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dpad { position:relative; width:180px; height:168px; margin:0 auto; }
    .dpad button { position:absolute; display:grid; place-items:center; width:56px; height:56px; padding:0; border-radius:12px; }
    .dpad button::after { position:absolute; inset:0; z-index:0; content:""; border-radius:12px; background:var(--edge); }
    .dpad button::before { position:absolute; inset:3px; z-index:1; content:""; border-radius:10px; background:linear-gradient(135deg,var(--charcoal),color-mix(in srgb,var(--charcoal) 78%,var(--edge))); }
    .dpad button:enabled:active::before { background:var(--pressed); }
    .dpad button span { position:relative; z-index:2; color:var(--surface); font-size:24px; }
    .dpad-up { left:62px; top:0; } .dpad-left { left:0; top:56px; } .dpad-right { left:124px; top:56px; } .dpad-down { left:62px; top:112px; }
    .feedback { min-height:18px; margin:0; color:var(--muted); font-size:10px; line-height:18px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    dialog { width:min(360px,calc(100% - 24px)); max-height:calc(100svh - 24px); padding:0; border:1px solid var(--charcoal); border-radius:13px; color:var(--ink); background:var(--surface); box-shadow:0 14px 44px color-mix(in srgb,var(--charcoal) 28%,transparent); overflow:auto; }
    dialog::backdrop { background:color-mix(in srgb,var(--charcoal) 26%,transparent); }
    #result-dialog { width:min(306px,calc(100% - 24px)); }
    #result-dialog::backdrop { background:transparent; }
    .dialog-card { display:grid; gap:10px; padding:16px; }
    .dialog-title { margin:0; font-size:20px; font-weight:850; text-align:center; }
    .dialog-copy,.record-note { margin:0; color:var(--muted); font-size:11px; line-height:1.45; text-align:center; }
    .dialog-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; }
    .dialog-actions button,.dialog-actions a { flex:1 1 82px; min-height:48px; padding:0 10px; border:1px solid var(--grid); border-radius:9px; background:#fffdf7; font-size:11px; text-align:center; }
    .dialog-actions .primary { color:#fff; background:var(--charcoal); border-color:var(--charcoal); }
    .record-head { display:grid; grid-template-columns:48px 1fr 48px; align-items:center; }
    .record-head h2 { margin:0; font-size:18px; text-align:center; }
    .record-close { border:1px solid var(--grid); border-radius:9px; background:#fffdf7; font-size:12px; }
    .record-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .record-card { min-height:86px; padding:10px; border:1px solid var(--grid); border-radius:11px; background:#fffdf7; }
    .record-card h3 { margin:0 0 6px; font-size:12px; }
    .record-value { margin:0; color:var(--ink); font-size:18px; font-weight:850; }
    .record-meta { min-height:16px; margin:3px 0 0; color:var(--muted); font-size:10px; }
    .record-compare { min-height:32px; display:grid; place-items:center; margin:0; padding:6px 8px; border-radius:9px; background:var(--floor); color:var(--ink); font-size:11px; font-weight:750; text-align:center; }
    .record-fallback { width:100%; min-height:48px; padding:0 9px; border:1px solid var(--grid); border-radius:9px; background:#fffdf7; color:var(--ink); font:inherit; font-size:10px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <button id="restart-top" class="icon-button" type="button" disabled aria-label="레이드 다시 시작"><span aria-hidden="true">↻</span></button>
      <h1>Few Moves<small>레이드</small></h1>
      <div class="top-actions"><button id="save-button" class="top-action" type="button" data-raid-action="Save" disabled>저장</button><button id="record-top" class="top-action" type="button" disabled>기록</button><a class="top-action" href="../index.html">모드</a></div>
    </header>
    <section class="raid-layout" aria-label="Few Moves 레이드">
      <section class="board-stage" aria-label="16×16 레이드 보드"><canvas id="unity-canvas" tabindex="0" aria-label="16×16 보드에서 플레이어와 뱀이 움직이는 레이드 보드"></canvas></section>
      <section class="controls" aria-label="레이드 조작">
        <div class="status-row">
          <div class="goal-panel" aria-live="polite">
            <svg class="goal-icon tail" viewBox="0 0 9 9" aria-hidden="true"><path fill="currentColor" d="M5 0 3 4h2L3 9l4-5H5l1-4Z"></path></svg>
            <div class="goal-copy"><strong id="tail-count">꼬리 조각 0/3</strong><small id="goal-help">3개 모으면 강화</small></div>
            <div class="charge-meter" aria-label="꼬리 조각 충전"><span class="charge-pip" aria-hidden="true"></span><span class="charge-pip" aria-hidden="true"></span><span class="charge-pip" aria-hidden="true"></span></div>
          </div>
          <span id="turn-label" class="turn-label">레이드 대기<small>행동 0</small></span>
        </div>
        <div class="bonus-row" aria-label="레이드 강화 효과">
          <div class="bonus-chip shield">
            <svg class="bonus-icon shield" viewBox="0 0 9 9" aria-hidden="true"><path fill="currentColor" d="M1 1h7v3c0 2-2 3.5-3.5 4C3 7.5 1 6 1 4V1Z"></path></svg>
            <div class="bonus-copy"><strong>보호막 <span id="shield-count">0회</span></strong><small>충돌 막기</small></div>
          </div>
          <div class="bonus-chip magnet">
            <svg class="bonus-icon magnet" viewBox="0 0 9 9" aria-hidden="true"><path fill="currentColor" d="M1 1v4c0 2 1.5 3 3.5 3S8 7 8 5V1H6v4c0 .8-.6 1-1.5 1S3 5.8 3 5V1H1Z"></path></svg>
            <div class="bonus-copy"><strong>자석 <span id="magnet-count">대기</span></strong><small>주변 조각 수집</small></div>
          </div>
          <div class="bonus-chip slow">
            <svg class="bonus-icon slow" viewBox="0 0 9 9" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square" d="M1 1h7M1 8h7M2 1c0 2 2.5 2 2.5 3.5S2 6 2 8M7 1c0 2-2.5 2-2.5 3.5S7 6 7 8"></path></svg>
            <div class="bonus-copy"><strong>감속 <span id="slow-count">대기</span></strong><small>뱀 이동 늦춤</small></div>
          </div>
        </div>
        <div class="dpad" aria-label="방향 조작"><button class="dpad-up" type="button" data-raid-action="Slide" data-direction="Up" disabled aria-label="위로 이동"><span aria-hidden="true">▲</span></button><button class="dpad-left" type="button" data-raid-action="Slide" data-direction="Left" disabled aria-label="왼쪽으로 이동"><span aria-hidden="true">◀</span></button><button class="dpad-right" type="button" data-raid-action="Slide" data-direction="Right" disabled aria-label="오른쪽으로 이동"><span aria-hidden="true">▶</span></button><button class="dpad-down" type="button" data-raid-action="Slide" data-direction="Down" disabled aria-label="아래로 이동"><span aria-hidden="true">▼</span></button></div>
        <p id="feedback" class="feedback" role="status" aria-live="polite">레이드를 준비하는 중입니다.</p>
      </section>
    </section>
  </main>
  <dialog id="result-dialog" aria-labelledby="result-title"><div class="dialog-card"><p id="result-title" class="dialog-title">레이드 결과</p><p id="result-copy" class="dialog-copy"></p><div class="dialog-actions"><button id="result-record" type="button">기록 보기</button><a href="../index.html">모드 선택</a><button id="result-restart" class="primary" type="button" data-raid-action="Restart">다시 도전</button></div></div></dialog>
  <dialog id="record-dialog" aria-labelledby="record-title"><div class="dialog-card"><header class="record-head"><span></span><h2 id="record-title">기록</h2><button id="record-close" class="record-close" type="button">닫기</button></header><div class="record-grid"><section class="record-card"><h3>내 최고</h3><p id="mine-value" class="record-value">기록 없음</p><p id="mine-meta" class="record-meta"></p></section><section class="record-card"><h3>공유 기록</h3><p id="shared-value" class="record-value">기록 없음</p><p id="shared-meta" class="record-meta"></p></section></div><p id="record-compare" class="record-compare">비교할 공유 기록이 없습니다.</p><p id="record-note" class="record-note" role="status" aria-live="polite">완주 기록만 공유할 수 있습니다.</p><div class="dialog-actions"><button id="record-get" type="button">현재 기록 확인</button><button id="record-share" type="button" disabled>완주 기록 공유</button><button id="record-challenge" class="primary" type="button" disabled>다시 시작해서 도전</button></div><input id="record-fallback" class="record-fallback" type="text" readonly hidden aria-label="복사할 레이드 기록 링크"></div></dialog>
  <script>
    (function () {
      "use strict";
      var canvas=document.querySelector("#unity-canvas"), boardStage=document.querySelector(".board-stage"), unityInstance=null, currentState=null;
      var feedback=document.querySelector("#feedback"), turnLabel=document.querySelector("#turn-label"), tailCount=document.querySelector("#tail-count"), goalHelp=document.querySelector("#goal-help"), chargePips=Array.from(document.querySelectorAll(".charge-pip")), shieldCount=document.querySelector("#shield-count"), magnetCount=document.querySelector("#magnet-count"), slowCount=document.querySelector("#slow-count");
      var resultDialog=document.querySelector("#result-dialog"), resultTitle=document.querySelector("#result-title"), resultCopy=document.querySelector("#result-copy"), recordDialog=document.querySelector("#record-dialog"), recordTop=document.querySelector("#record-top"), recordNote=document.querySelector("#record-note"), recordGet=document.querySelector("#record-get"), recordShare=document.querySelector("#record-share"), recordChallenge=document.querySelector("#record-challenge"), recordFallback=document.querySelector("#record-fallback");
      var mineValue=document.querySelector("#mine-value"), mineMeta=document.querySelector("#mine-meta"), sharedValue=document.querySelector("#shared-value"), sharedMeta=document.querySelector("#shared-meta"), recordCompare=document.querySelector("#record-compare");
      var pendingRecordCapsule="", pendingRecordRequestId="", lastImportedRecordHash="", lastAcceptedRecordRequestId="", acceptedRecordView=null, recordImportSequence=0, observedInitialized=false, recordImportPending=false, recordImportAwaitingObservation=false, recordImportMessage="", suppressedResultKey="", shareAttempt=0;
      function openDialog(dialog){ if(!dialog||dialog.open)return; try{ if(dialog.showModal)dialog.showModal(); else dialog.setAttribute("open",""); }catch(error){ dialog.setAttribute("open",""); } }
      function closeDialog(dialog){ if(!dialog||!dialog.open)return; if(dialog.close)dialog.close(); else dialog.removeAttribute("open"); }
      function validState(state){ return state&&typeof state.initialized==="boolean"&&typeof state.inputEnabled==="boolean"&&typeof state.transitioning==="boolean"&&typeof state.statusCode==="string"; }
      function usable(summary){ return summary&&typeof summary.modeId==="string"&&summary.modeId&&typeof summary.definitionId==="string"&&summary.definitionId&&typeof summary.rulesVersion==="string"&&summary.rulesVersion&&typeof summary.contentVersion==="string"&&summary.contentVersion&&typeof summary.definitionFingerprint==="string"&&summary.definitionFingerprint&&summary.statusCode==="Cleared"&&Number.isInteger(summary.effectiveActionCount)&&summary.effectiveActionCount>0&&Number.isInteger(summary.logicalActionCount)&&summary.logicalActionCount>=0; }
      function sameIdentity(a,b){ return usable(a)&&usable(b)&&a.modeId===b.modeId&&a.definitionId===b.definitionId&&a.rulesVersion===b.rulesVersion&&a.contentVersion===b.contentVersion&&a.definitionFingerprint===b.definitionFingerprint; }
      function captureRecordView(state){return{recordStatus:state.recordStatus,recordCapsule:state.recordCapsule,recordError:state.recordError,hasShared:state.hasShared===true,shared:state.shared};}
      function visibleRecordView(){return acceptedRecordView||currentState||{};}
      function observeRecordResult(state){var responseId=typeof state.sharedRecordRequestId==="string"?state.sharedRecordRequestId:"";if(recordImportPending){if(!recordImportAwaitingObservation||responseId!==pendingRecordRequestId)return;recordImportAwaitingObservation=false;recordImportPending=false;recordImportMessage="";lastAcceptedRecordRequestId=responseId;acceptedRecordView=captureRecordView(state);return;}if(responseId&&responseId===lastAcceptedRecordRequestId){acceptedRecordView=captureRecordView(state);return;}if(!responseId&&!lastAcceptedRecordRequestId&&!pendingRecordCapsule)acceptedRecordView=captureRecordView(state);}
      function hasBlockingFocus(){ var active=document.activeElement; return !!document.querySelector("dialog[open]")||!!(active&&(active.tagName==="INPUT"||active.tagName==="TEXTAREA"||active.tagName==="SELECT"||active.isContentEditable)); }
      function send(command){ if(!unityInstance||!currentState)return false; unityInstance.SendMessage("RaidBootstrap","HandleCommand",JSON.stringify(command)); return true; }
      function actionAllowed(button){ if(!currentState||!validState(currentState)||!currentState.initialized||currentState.transitioning)return false; var kind=button.dataset.raidAction; if(kind==="Slide")return currentState.inputEnabled&&(currentState.statusCode==="Playing"||currentState.statusCode==="Armed"); if(kind==="Restart")return true; return kind==="Save"; }
      function renderButtons(){ Array.from(document.querySelectorAll("button[data-raid-action]")).forEach(function(button){button.disabled=!actionAllowed(button);}); document.querySelector("#restart-top").disabled=!actionAllowed({dataset:{raidAction:"Restart"}}); recordTop.disabled=!currentState||!currentState.initialized; }
      function terminalKey(state){ return (state.statusCode==="Cleared"||state.statusCode==="Failed")?[state.statusCode,state.actions,state.stateFingerprint].join("|"):""; }
      function renderResult(state){ var key=terminalKey(state); if(!key||state.transitioning){ closeDialog(resultDialog); if(!key)suppressedResultKey=""; return; } if(recordDialog.open){suppressedResultKey=key;return;} if(suppressedResultKey===key)return; resultTitle.textContent=state.statusCode==="Cleared"?"레이드 성공":"다시 도전"; resultCopy.textContent=state.statusCode==="Cleared"?("행동 "+String(state.actions)+"회 · 피격 "+String(state.hits)+"회로 끝냈습니다."):"보호막이 없던 충돌로 이번 판이 끝났습니다."; openDialog(resultDialog); }
      function renderRecord(state){ var source=acceptedRecordView||state,mine=state.hasMine===true&&usable(state.mine)?state.mine:null, shared=!recordImportPending&&source.hasShared===true&&usable(source.shared)?source.shared:null; mineValue.textContent=mine?String(mine.effectiveActionCount)+"수":"기록 없음"; mineMeta.textContent=mine?"피격 "+String(mine.hits)+"회":"완주하면 최고 기록이 남습니다."; sharedValue.textContent=recordImportPending?"확인 중":shared?String(shared.effectiveActionCount)+"수":"기록 없음"; sharedMeta.textContent=recordImportPending?"":shared?"피격 "+String(shared.hits)+"회":"링크를 열면 여기 표시됩니다."; if(recordImportPending)recordCompare.textContent="새 링크의 기록을 확인하고 있습니다."; else if(mine&&shared&&sameIdentity(mine,shared)){ var delta=mine.effectiveActionCount-shared.effectiveActionCount; recordCompare.textContent=delta===0?(mine.hits===shared.hits?"행동 수와 피격 수가 같습니다.":(mine.hits<shared.hits?"행동 수는 같고 내 피격이 "+String(shared.hits-mine.hits)+"회 적습니다.":"행동 수는 같고 내 피격이 "+String(mine.hits-shared.hits)+"회 많습니다.")):(delta<0?"내 최고가 공유 기록보다 "+String(-delta)+"수 적습니다.":"내 최고가 공유 기록보다 "+String(delta)+"수 많습니다."); }else recordCompare.textContent=mine&&shared?"같은 판의 기록만 비교할 수 있습니다.":"비교할 두 기록이 아직 없습니다."; var capsule=typeof source.recordCapsule==="string"?source.recordCapsule:""; recordGet.disabled=!state.initialized||state.transitioning||state.statusCode!=="Cleared"; recordShare.disabled=!capsule||source.recordStatus!=="ready"||state.transitioning; recordChallenge.disabled=!shared||state.transitioning; if(!capsule)recordFallback.hidden=true; if(recordImportPending)recordNote.textContent=recordImportMessage; else if(source.recordError)recordNote.textContent="기록을 확인할 수 없습니다."; else if(shared)recordNote.textContent="검증된 공유 기록을 불러왔습니다."; else if(capsule&&source.recordStatus==="ready")recordNote.textContent="현재 완주 기록을 공유할 수 있습니다."; else recordNote.textContent="완주 기록만 공유할 수 있습니다."; }
