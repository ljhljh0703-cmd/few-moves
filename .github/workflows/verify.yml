name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v6.0.2
      - name: Check out without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # actions/setup-python v6.2.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Run source manifest checks
        run: python3 -m unittest tools.tests.test_artifact_manifest

      # actions/setup-node v6.4.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: Run browser contract checks
        run: |
          node tests/mobile_ui_contract.test.cjs
          node tests/webgl_persistence_contract.test.cjs
          node tests/coop_ui_contract.test.cjs
          node tests/coop_online_ui_contract.test.cjs

      # actions/setup-dotnet v5.2.0
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.203'

      - name: Run sliding puzzle checks
        run: dotnet run --project tools/SlideChecks/SlideChecks.csproj --configuration Release

      - name: Run co-op core checks
        run: dotnet run --project tools/CoopChecks/CoopChecks.csproj --configuration Release

      - name: Run co-op server HTTP checks
        run: dotnet run --project tools/CoopServerChecks/CoopServerChecks.csproj --configuration Release

      - name: Run Toss policy checks
        run: dotnet run --project tools/TossPlatformChecks/TossPlatformChecks.csproj --configuration Release
